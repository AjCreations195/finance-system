<app-dashboard-card title="budget.title" icon="chart">
  <!-- Header filter: show spent, remaining or both series -->
  <div card-actions>
    <app-filter-menu [options]="seriesOptions" [(value)]="series" />
  </div>

  <!-- Chart title + total of visible data -->
  <div class="chart-head">
    <h3 class="chart-title">{{ 'budget.chartTitle' | translate }}</h3>
    <span class="total">{{ 'budget.totalRevenue' | translate }} <strong dir="ltr">${{ total() }}</strong></span>
  </div>

  <div class="chart-body">
    <app-chart [options]="chartOptions()" />
  </div>

  <!-- Year selector (bottom center, as in the design), styled like the other dropdowns -->
  <div class="year-wrap">
    <app-select-menu [options]="yearOptions" [value]="String(year())" (valueChange)="year.set(+$any($event))" appearance="text" align="start" placement="up" ariaLabel="budget.year" />
  </div>
</app-dashboard-card>
