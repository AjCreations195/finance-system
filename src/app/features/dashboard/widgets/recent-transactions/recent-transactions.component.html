<app-dashboard-card title="transactions.title" icon="transactions">
  <div card-actions class="d-flex gap-2">
    <app-filter-menu [options]="typeOptions" [(value)]="type" />
    <div class="search-box" style="flex: 0 1 13rem; min-width: 8rem">
      <app-icon name="search" class="search-icon" />
      <input type="search" [value]="search()" (input)="search.set($any($event.target).value)" [placeholder]="'common.search' | translate" [attr.aria-label]="'common.search' | translate" />
    </div>
  </div>

  <div class="table-responsive">
    <table class="table fs-table">
      <thead>
        <tr>
          @for (col of columns; track col) {
            <th scope="col" [attr.aria-sort]="sort.aria(col)">
              <button type="button" class="sort-header" (click)="sort.toggle(col)">
                {{ 'transactions.columns.' + col | translate }}
                <i [class]="sort.icon(col)" aria-hidden="true"></i>
              </button>
            </th>
          }
          <th scope="col"><span class="visually-hidden">{{ 'common.actions' | translate }}</span></th>
        </tr>
      </thead>
      <tbody>
        @for (t of rows(); track t.id) {
          <tr>
            <td><a href="#" class="ref-link" (click)="$event.preventDefault(); notAvailable()">{{ t.number }}</a></td>
            <td class="text-nowrap">{{ 'transactions.types.' + t.type | translate }}</td>
            <td>
              <div class="person-cell">
                <span class="person-avatar"><app-icon name="person" /></span>
                <div>
                  <div class="person-name">{{ t.employee.name | localize }}</div>
                  <div class="person-email">{{ t.employee.email }}</div>
                </div>
              </div>
            </td>
            <td class="text-nowrap">{{ duration(t) }}</td>
            <td>
              <div class="row-actions">
                <button type="button" (click)="notAvailable()" [attr.aria-label]="'common.moreOptions' | translate">
                  <app-icon name="more-vertical" />
                </button>
              </div>
            </td>
          </tr>
        } @empty {
          <tr><td colspan="5" class="text-center py-4">{{ 'common.noResults' | translate }}</td></tr>
        }
      </tbody>
    </table>
  </div>

  <button type="button" class="show-more" (click)="notAvailable()">
    {{ 'transactions.showMore' | translate: { count: data.transactionsTotal() - data.transactions().length } }}
    <span class="show-more-arrow"><app-icon name="arrow-left" /></span>
  </button>
</app-dashboard-card>
