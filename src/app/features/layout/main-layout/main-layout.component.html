<!-- Top navbar (fixed) -->
<app-navbar (menuToggle)="sidebarOpen.set(!sidebarOpen())" />

<!-- Sidebar (fixed, inline-start side) -->
<app-sidebar [collapsed]="sidebarCollapsed()" [open]="sidebarOpen()" (toggleCollapse)="toggleCollapsed()" />

<!-- Backdrop behind the mobile sidebar -->
@if (sidebarOpen()) {
  <div class="sidebar-backdrop d-lg-none" (click)="sidebarOpen.set(false)" aria-hidden="true"></div>
}

<!-- Page area: offset by navbar height and sidebar width -->
<!-- AI assistant panel (opened from the navbar's chat button) -->
<app-chat-panel />

<main class="content">
  <app-workspace-tabs />
  <router-outlet />
</main>
